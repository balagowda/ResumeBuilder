<!DOCTYPE html>
<!--
  Source for public/og-image.png — the 1200x630 card shown when the site is
  shared on LinkedIn, Slack, WhatsApp, X or Reddit.

  Regenerate after editing:  npm run og:image
  (Renders this file in headless Chrome at exactly 1200x630.)

  Only system fonts here: the renderer has no network access, so a webfont
  would silently fall back and shift the layout.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        background: #ffffff;
        display: flex;
      }

      .left {
        flex: 1;
        padding: 68px 0 68px 76px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .wordmark {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #4f46e5;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 62px;
        line-height: 1.06;
        letter-spacing: -1.6px;
        font-weight: 800;
        color: #16203a;
        margin-bottom: 26px;
      }

      h1 span {
        background: linear-gradient(120deg, #4f46e5 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        font-size: 25px;
        line-height: 1.45;
        color: #55617a;
        max-width: 560px;
        margin-bottom: 34px;
      }

      .badges { display: flex; gap: 12px; flex-wrap: wrap; }

      .badge {
        font-size: 19px;
        font-weight: 700;
        color: #4f46e5;
        background: rgba(79, 70, 229, 0.1);
        border-radius: 999px;
        padding: 10px 20px;
      }

      /* Right side: an abstract resume sheet, tilted. */
      .right {
        width: 430px;
        background: linear-gradient(150deg, #eef0fe 0%, #f7f4ff 100%);
        position: relative;
        overflow: hidden;
      }

      .sheet {
        position: absolute;
        top: 74px;
        left: 62px;
        width: 340px;
        height: 482px;
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0 26px 60px rgba(23, 25, 82, 0.22);
        transform: rotate(6deg);
        padding: 30px 28px;
      }

      .line { background: #dfe3ee; border-radius: 4px; height: 9px; margin-bottom: 11px; }
      .line.name { height: 19px; width: 62%; background: #16203a; margin-bottom: 10px; }
      .line.role { height: 11px; width: 42%; background: #6f7ce0; margin-bottom: 24px; }
      .line.head { height: 10px; width: 32%; background: #4f46e5; margin: 24px 0 13px; }
      .line.w90 { width: 90%; }
      .line.w75 { width: 75%; }
      .line.w82 { width: 82%; }
      .line.w60 { width: 60%; }

      .chips { display: flex; gap: 8px; margin-top: 6px; }
      .chip { height: 16px; width: 58px; border-radius: 999px; background: #e7e9f8; }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="wordmark">HatchResume</div>
      <h1>Free resume builder,<br /><span>no sign-up</span></h1>
      <p>
        30+ ATS-friendly templates. Build it in your browser, download the PDF,
        keep your data.
      </p>
      <div class="badges">
        <div class="badge">100% free</div>
        <div class="badge">No watermark</div>
        <div class="badge">Nothing uploaded</div>
      </div>
    </div>

    <div class="right">
      <div class="sheet">
        <div class="line name"></div>
        <div class="line role"></div>
        <div class="line w90"></div>
        <div class="line w75"></div>
        <div class="line head"></div>
        <div class="line w90"></div>
        <div class="line w82"></div>
        <div class="line w60"></div>
        <div class="line head"></div>
        <div class="line w82"></div>
        <div class="line w90"></div>
        <div class="line w75"></div>
        <div class="line head"></div>
        <div class="chips">
          <div class="chip"></div>
          <div class="chip"></div>
          <div class="chip"></div>
        </div>
      </div>
    </div>
  </body>
</html>
